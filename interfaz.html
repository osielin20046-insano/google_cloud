<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica Google Cloud - ISD</title>
  <link rel="stylesheet" href="diseño.css">
</head>
<body>

  <div class="card">
    <h1>Interacción de Servicios Digitales</h1>
    <h3>Conexión con Google Cloud Storage</h3>
    <p>Consulta los datos de la nube:</p>

    <div class="acciones-superiores">
      <button onclick="obtenerDatosDeGoogleCloud()" class="btn-cargar">Cargar desde la Nube</button>
      <button onclick="agregarFila()" class="btn-agregar" id="btn-agregar" style="display: none;">Agregar Alumno</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Edad</th>
          <th>Carrera</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="tabla-cuerpo">
        <tr>
          <td colspan="5" style="text-align: center; color: #777;">Presiona el botón para cargar los datos...</td>
        </tr>
      </tbody>
    </table>

    <div class="acciones">
      <button onclick="guardarCambios()" class="btn-guardar" id="btn-guardar" style="display: none;">Guardar Cambios</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
